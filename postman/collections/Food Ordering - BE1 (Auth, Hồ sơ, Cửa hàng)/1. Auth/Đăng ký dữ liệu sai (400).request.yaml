$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "a",
      "password": "1",
      "role": "ADMIN",
      "email": "sai",
      "phone": "12"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Có danh sách errors", () => pm.expect(pm.response.json().errors.length).to.be.above(0));
    language: text/javascript
order: 4000
