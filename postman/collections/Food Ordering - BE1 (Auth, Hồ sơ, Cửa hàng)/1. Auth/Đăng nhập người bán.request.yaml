$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "nb_{{suffix}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.collectionVariables.set("sellerToken", json.data.token);
      pm.test("Có token", () => pm.expect(json.data.token).to.be.a("string"));
    language: text/javascript
order: 6000
