$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "nb_{{suffix}}",
      "password": "{{password}}",
      "role": "SELLER",
      "fullName": "Người Bán Test",
      "email": "nb{{suffix}}@example.com",
      "phone": "08{{suffix}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.test("PENDING_APPROVAL", () => pm.expect(pm.response.json().data.status).to.eql("PENDING_APPROVAL"));
    language: text/javascript
order: 2000
