$kind: http-request
url: "{{baseUrl}}/shops"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Quán Hai",
      "address": "2 Tạ Quang Bửu",
      "phone": "0243000010"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
