$kind: http-request
url: "{{baseUrl}}/sellers/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("shop chờ duyệt", () => pm.expect(pm.response.json().data.shop.status).to.eql("PENDING_APPROVAL"));
    language: text/javascript
order: 4000
