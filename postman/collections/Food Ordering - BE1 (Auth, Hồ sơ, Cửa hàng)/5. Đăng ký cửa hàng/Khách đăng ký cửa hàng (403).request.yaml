$kind: http-request
url: "{{baseUrl}}/shops"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Quán",
      "address": "x",
      "phone": "0243000011"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
