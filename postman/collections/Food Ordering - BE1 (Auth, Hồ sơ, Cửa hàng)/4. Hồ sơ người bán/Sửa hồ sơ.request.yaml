$kind: http-request
url: "{{baseUrl}}/sellers/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Người Bán Đã Sửa",
      "email": "nb{{suffix}}@example.com",
      "phone": "08{{suffix}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
