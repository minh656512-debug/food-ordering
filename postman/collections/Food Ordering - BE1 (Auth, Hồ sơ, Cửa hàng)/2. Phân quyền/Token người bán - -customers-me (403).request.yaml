$kind: http-request
name: Token người bán -> /customers/me (403)
url: "{{baseUrl}}/customers/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
