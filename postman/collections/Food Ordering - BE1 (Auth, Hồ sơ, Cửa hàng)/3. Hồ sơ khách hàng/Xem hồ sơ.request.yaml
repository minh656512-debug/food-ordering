$kind: http-request
url: "{{baseUrl}}/customers/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Có loyaltyPoints", () => pm.expect(pm.response.json().data).to.have.property("loyaltyPoints"));
    language: text/javascript
order: 1000
