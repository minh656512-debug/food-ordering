$kind: http-request
url: "{{baseUrl}}/seller/orders"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{sellerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Mã trả về 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const d = body.data;
      pm.test("Có đơn A", () => pm.expect(d.items.map(o => String(o.id))).to.include(pm.collectionVariables.get("orderA")));
    language: text/javascript
order: 10000
