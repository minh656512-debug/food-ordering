$kind: http-request
url: "{{baseUrl}}/sellers/me"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{seller2Token}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Mã trả về 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const d = body.data;
      if (body.success) pm.collectionVariables.set("shop2Id", String(d.shop.id));
    language: text/javascript
order: 9000
