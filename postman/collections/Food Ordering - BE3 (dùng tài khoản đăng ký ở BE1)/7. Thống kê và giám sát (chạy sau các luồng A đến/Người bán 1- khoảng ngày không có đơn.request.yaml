$kind: http-request
name: "Người bán 1: khoảng ngày không có đơn"
url: "{{baseUrl}}/shops/{{shopId}}/statistics/revenue?groupBy=day&from=2020-01-01&to=2020-01-31"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{sellerToken}}
queryParams:
  groupBy: day
  from: 2020-01-01
  to: 2020-01-31
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Mã trả về 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const d = body.data;
      pm.test("Doanh thu 0", () => { pm.expect(d.summary.totalRevenue).to.eql(0); pm.expect(d.series.length).to.eql(0); });
    language: text/javascript
order: 4000
