$kind: http-request
name: "Admin: lọc đơn COMPLETED của cửa hàng 1 (2 đơn)"
url: "{{baseUrl}}/admin/orders?shopId={{shopId}}&status=COMPLETED"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
queryParams:
  shopId: "{{shopId}}"
  status: COMPLETED
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Mã trả về 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const d = body.data;
      pm.test("Đúng 2 đơn", () => pm.expect(d.pagination.total).to.eql(2));
    language: text/javascript
order: 9000
