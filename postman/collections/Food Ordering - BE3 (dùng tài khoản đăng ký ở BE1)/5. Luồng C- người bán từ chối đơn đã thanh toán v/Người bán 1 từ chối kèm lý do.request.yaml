$kind: http-request
url: "{{baseUrl}}/orders/{{orderC}}/reject"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{sellerToken}}
body:
  type: json
  content: |-
    {
      "reason": "Quán hết nguyên liệu"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Mã trả về 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const d = body.data;
      pm.test("Đơn chuyển sang REJECTED", () => pm.expect(d.status).to.eql("REJECTED"));
      pm.test("Hoàn đủ 75.000, payment REFUNDED", () => { pm.expect(d.refund.amount).to.eql(75000); pm.expect(d.payment.status).to.eql("REFUNDED"); pm.expect(d.refund.reason).to.include("Quán hết nguyên liệu"); });
    language: text/javascript
order: 6000
