$kind: http-request
url: "{{baseUrl}}/orders/{{orderC}}/cancel"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenC}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Mã trả về 409", () => pm.response.to.have.status(409));
      const body = pm.response.json();
      const d = body.data;
      pm.test("errorCode là ORDER_NOT_CANCELLABLE", () => pm.expect(body.errorCode).to.eql("ORDER_NOT_CANCELLABLE"));
    language: text/javascript
order: 8000
