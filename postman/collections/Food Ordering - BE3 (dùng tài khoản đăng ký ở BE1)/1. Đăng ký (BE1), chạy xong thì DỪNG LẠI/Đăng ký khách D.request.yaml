$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "khD_{{suffix}}",
      "password": "{{password}}",
      "role": "CUSTOMER",
      "fullName": "Khách D",
      "email": "khD{{suffix}}@example.com",
      "phone": "094{{suffix}}",
      "address": "Hà Nội"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Mã trả về 201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      const d = body.data;
    language: text/javascript
order: 4000
